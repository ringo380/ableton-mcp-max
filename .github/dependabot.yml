version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Bundle non-major updates into a single PR to cut noise; the only direct
      # dependency is mcp[cli], so most of these are transitive.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
