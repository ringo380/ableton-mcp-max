[project]
name = "ableton-mcp-max"
version = "0.35.1"
description = "Self-owned, extensible Ableton Live MCP server"
requires-python = ">=3.10"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.md"]
dependencies = [
    "mcp[cli]>=1.3.0",
    "cbor2>=5.6.0",
    "zstandard>=0.22.0",
    "comtypes>=1.4 ; sys_platform == 'win32'",
]

[project.scripts]
ableton-mcp-max = "ableton_mcp_max.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ableton_mcp_max"]
